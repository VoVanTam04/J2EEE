<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
    layout:decorate="~{_layout}">

<head>
    <title>Chi tiết đơn hàng</title>
</head>

<body>
    <div layout:fragment="content">
        <div class="mb-4">
            <a href="/order" class="btn btn-outline-secondary btn-sm mb-2">
                <i class="fa-solid fa-arrow-left me-1"></i> Quay lại
            </a>
            <h2 class="text-primary"><i class="fa-solid fa-receipt me-2"></i>Đơn hàng #<span th:text="${order.id}"></span></h2>
        </div>

        <div class="card mb-3">
            <div class="card-header bg-light">
                <span class="fw-bold">Ngày đặt:</span> <span th:text="${#temporals.format(order.orderDate, 'dd/MM/yyyy HH:mm')}"></span>
                <span class="ms-3 fw-bold">Trạng thái:</span> <span class="badge bg-warning text-dark" th:text="${order.status}"></span>
            </div>
            <div class="card-body p-0">
                <table class="table table-hover align-middle mb-0">
                    <thead class="table-light">
                        <tr>
                            <th class="py-3 ps-3">Sản phẩm</th>
                            <th class="py-3">Đơn giá</th>
                            <th class="py-3">Số lượng</th>
                            <th class="py-3">Thành tiền</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="item : ${order.items}">
                            <td class="ps-3 fw-semibold" th:text="${item.product.name}"></td>
                            <td th:text="${#numbers.formatDecimal(item.price, 0, 'COMMA', 0, 'POINT')} + ' VNĐ'"></td>
                            <td th:text="${item.quantity}"></td>
                            <td class="text-success fw-bold" th:text="${#numbers.formatDecimal(item.price * item.quantity, 0, 'COMMA', 0, 'POINT')} + ' VNĐ'"></td>
                        </tr>
                    </tbody>
                </table>
            </div>
            <div class="card-footer text-end">
                <span class="fw-bold me-2">Tổng cộng:</span>
                <span class="text-success fs-5 fw-bold" th:text="${#numbers.formatDecimal(order.totalAmount, 0, 'COMMA', 0, 'POINT')} + ' VNĐ'"></span>
            </div>
        </div>
    </div>
</body>
</html>
