<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
    layout:decorate="~{_layout}">

<head>
    <title>Danh sách sản phẩm</title>
</head>

<body>
    <div layout:fragment="content">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h2 class="text-primary"><i class="fa-solid fa-list me-2"></i>Danh sách sản phẩm</h2>
            <a href="/products/add" class="btn btn-success shadow-sm" sec:authorize="hasRole('ADMIN')">
                <i class="fa-solid fa-plus me-1"></i> Thêm mới
            </a>
        </div>

        <div th:if="${success}" class="alert alert-success" th:text="${success}"></div>
        <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

        <!-- Start Filter Form -->
        <div class="card mb-4 shadow-sm border-0">
            <div class="card-body bg-light">
                <form th:action="@{/products}" method="get" class="row g-3">
                    <div class="col-md-4">
                        <div class="input-group">
                            <span class="input-group-text bg-white"><i class="fa-solid fa-magnifying-glass text-muted"></i></span>
                            <input type="text" name="keyword" th:value="${keyword}" class="form-control" placeholder="Tìm kiếm sản phẩm...">
                        </div>
                    </div>
                    <div class="col-md-3">
                        <select name="categoryId" class="form-select">
                            <option value="">-- Tất cả danh mục --</option>
                            <option th:each="cat : ${categories}" th:value="${cat.id}" th:text="${cat.name}" th:selected="${cat.id == categoryId}"></option>
                        </select>
                    </div>
                    <div class="col-md-3">
                        <select name="sortDir" class="form-select">
                            <option value="asc" th:selected="${sortDir == 'asc'}">Sắp xếp: Giá tăng dần</option>
                            <option value="desc" th:selected="${sortDir == 'desc'}">Sắp xếp: Giá giảm dần</option>
                        </select>
                        <input type="hidden" name="sortField" value="price">
                    </div>
                    <div class="col-md-2">
                        <button type="submit" class="btn btn-primary w-100"><i class="fa-solid fa-filter"></i> Lọc kết quả</button>
                    </div>
                </form>
            </div>
        </div>
        <!-- End Filter Form -->

        <div class="card">
            <div class="card-body p-0">
                <div class="table-responsive">
                    <table class="table table-hover table-striped align-middle mb-0">
                        <thead class="table-primary text-white">
                            <tr>
                                <th class="py-3 ps-3">ID</th>
                                <th class="py-3">Tên sản phẩm</th>
                                <th class="py-3">Giá</th>
                                <th class="py-3">Hình ảnh</th>
                                <th class="py-3">Danh mục</th>
                                <th class="py-3 text-center">Hành động</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="p : ${listproduct}">
                                <td class="ps-3 fw-bold" th:text="${p.id}"></td>
                                <td class="fw-semibold" th:text="${p.name}"></td>
                                <td class="text-success fw-bold" th:text="${#numbers.formatDecimal(p.price, 0, 'COMMA', 0, 'POINT')} + ' VNĐ'"></td>
                                <td>
                                    <img th:if="${p.image != null}" th:src="@{'/images/' + ${p.image}}" 
                                         width="60" height="60" class="border shadow-sm" alt="Product Image"/>
                                    <span th:unless="${p.image != null}" class="badge bg-secondary">No Image</span>
                                </td>
                                <td>
                                    <span class="badge bg-info text-dark" th:text="${p.category != null ? p.category.name : 'Unknown'}"></span>
                                </td>
                                <td class="text-center">
                                    <a th:href="@{/products/edit/{id}(id=${p.id})}" class="btn btn-warning btn-sm me-1" title="Sửa" sec:authorize="hasRole('ADMIN')">
                                        <i class="fa-solid fa-pen-to-square"></i>
                                    </a>
                                    <a th:href="@{/products/delete/{id}(id=${p.id})}" 
                                       class="btn btn-danger btn-sm me-1"
                                       onclick="return confirm('Bạn có chắc muốn xóa sản phẩm này không?')" title="Xóa"
                                       sec:authorize="hasRole('ADMIN')">
                                        <i class="fa-solid fa-trash"></i>
                                    </a>
                                    <a th:href="@{/cart/add/{id}(id=${p.id})}" class="btn btn-info btn-sm text-white" title="Thêm vào giỏ">
                                        <i class="fa-solid fa-cart-plus"></i> Add to Cart
                                    </a>
                                </td>
                            </tr>
                            <tr th:if="${#lists.isEmpty(listproduct)}">
                                <td colspan="6" class="text-center py-4 text-muted">
                                    <i class="fa-regular fa-folder-open fa-2x mb-2"></i><br>Chưa có sản phẩm nào.
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>

        <!-- Start Pagination -->
        <div th:if="${totalPages > 0}" class="d-flex justify-content-between align-items-center mt-4">
            <div class="text-muted text-sm">
                Hiển thị <span class="fw-bold" th:text="${(currentPage - 1) * 5 + 1}"></span> 
                đến <span class="fw-bold" th:text="${(currentPage * 5) < totalItems ? (currentPage * 5) : totalItems}"></span> 
                trong tổng số <span class="fw-bold" th:text="${totalItems}"></span> sản phẩm
            </div>
            <nav aria-label="Page navigation">
                <ul class="pagination mb-0 shadow-sm">
                    <li class="page-item" th:classappend="${currentPage == 1 ? 'disabled' : ''}">
                        <a class="page-link" th:href="@{'/products?page=' + ${currentPage - 1} + '&keyword=' + ${keyword} + '&categoryId=' + ${categoryId != null ? categoryId : ''} + '&sortField=' + ${sortField} + '&sortDir=' + ${sortDir}}"><i class="fa-solid fa-chevron-left"></i> Previous</a>
                    </li>
                    <li class="page-item" th:each="i : ${#numbers.sequence(1, totalPages)}" th:classappend="${currentPage == i ? 'active' : ''}">
                        <a class="page-link" th:href="@{'/products?page=' + ${i} + '&keyword=' + ${keyword} + '&categoryId=' + ${categoryId != null ? categoryId : ''} + '&sortField=' + ${sortField} + '&sortDir=' + ${sortDir}}" th:text="${i}">1</a>
                    </li>
                    <li class="page-item" th:classappend="${currentPage == totalPages ? 'disabled' : ''}">
                        <a class="page-link" th:href="@{'/products?page=' + ${currentPage + 1} + '&keyword=' + ${keyword} + '&categoryId=' + ${categoryId != null ? categoryId : ''} + '&sortField=' + ${sortField} + '&sortDir=' + ${sortDir}}">Next <i class="fa-solid fa-chevron-right"></i></a>
                    </li>
                </ul>
            </nav>
        </div>
        <!-- End Pagination -->
    </div>
</body>
</html>
