<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
    layout:decorate="~{_layout}">

<head>
    <title>Giỏ hàng của bạn</title>
</head>

<body>
    <div layout:fragment="content">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h2 class="text-primary"><i class="fa-solid fa-cart-shopping me-2"></i>Giỏ hàng của bạn</h2>
            <a th:href="@{/products}" class="btn btn-outline-secondary shadow-sm">
                <i class="fa-solid fa-arrow-left me-1"></i> Tiếp tục mua hàng
            </a>
        </div>

        <div th:if="${success}" class="alert alert-success" th:text="${success}"></div>
        <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

        <div class="card shadow-sm">
            <div class="card-body p-0">
                <div class="table-responsive">
                    <table class="table table-hover table-striped align-middle mb-0">
                        <thead class="table-dark text-white">
                            <tr>
                                <th class="py-3 ps-3">Tên sản phẩm</th>
                                <th class="py-3">Hình ảnh</th>
                                <th class="py-3">Giá</th>
                                <th class="py-3" style="width: 180px;">Số lượng</th>
                                <th class="py-3">Thành tiền</th>
                                <th class="py-3 text-center">Hành động</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="item : ${cartItems}">
                                <td class="ps-3 fw-bold" th:text="${item.name}"></td>
                                <td>
                                    <img th:if="${item.image != null}" th:src="@{'/images/' + ${item.image}}" 
                                         width="60" height="60" class="border shadow-sm rounded" alt="Product Image"/>
                                    <span th:unless="${item.image != null}" class="badge bg-secondary">No Image</span>
                                </td>
                                <td class="text-success fw-bold" th:text="${#numbers.formatDecimal(item.price, 0, 'COMMA', 0, 'POINT')} + ' đ'"></td>
                                <td>
                                    <form th:action="@{/cart/update}" method="post" class="d-flex">
                                        <input type="hidden" name="productId" th:value="${item.productId}" />
                                        <input type="number" name="quantity" th:value="${item.quantity}" min="1" class="form-control form-control-sm me-1" style="width: 80px;" />
                                        <button type="submit" class="btn btn-sm btn-outline-primary">Cập nhật</button>
                                    </form>
                                </td>
                                <td class="text-danger fw-bold" th:text="${#numbers.formatDecimal(item.amount, 0, 'COMMA', 0, 'POINT')} + ' đ'"></td>
                                <td class="text-center">
                                    <a th:href="@{/cart/remove/{id}(id=${item.productId})}" 
                                       class="btn btn-outline-danger btn-sm"
                                       onclick="return confirm('Bạn có chắc muốn xóa sản phẩm này khỏi giỏ hàng?')" title="Xóa">
                                        <i class="fa-solid fa-trash"></i> Xóa
                                    </a>
                                </td>
                            </tr>
                            <tr th:if="${#lists.isEmpty(cartItems)}">
                                <td colspan="6" class="text-center py-5 text-muted">
                                    <i class="fa-solid fa-cart-arrow-down fa-3x mb-3 text-secondary"></i><br>
                                    <h4>Giỏ hàng trống</h4>
                                    <p>Bạn chưa chọn mua sản phẩm nào.</p>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
            <div class="card-footer bg-light d-flex justify-content-end align-items-center py-3" th:if="${!#lists.isEmpty(cartItems)}">
                <h4 class="mb-0 me-4">Tổng tiền: <span class="text-danger fw-bold" th:text="${#numbers.formatDecimal(totalAmount, 0, 'COMMA', 0, 'POINT')} + ' đ'"></span></h4>
                <form th:action="@{/order/checkout}" method="post">
                    <button type="submit" class="btn btn-success btn-lg shadow-sm px-4">
                        <i class="fa-solid fa-check-to-slot me-1"></i> Order
                    </button>
                </form>
            </div>
        </div>
    </div>
</body>
</html>
