<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
    layout:decorate="~{_layout}">

<head>
    <title>Danh sách danh mục</title>
</head>

<body>
    <div layout:fragment="content">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h2 class="text-primary"><i class="fa-solid fa-tags me-2"></i>Danh sách danh mục</h2>
            <a href="/categories/create" class="btn btn-success shadow-sm">
                <i class="fa-solid fa-plus me-1"></i> Thêm mới
            </a>
        </div>

        <div class="card">
            <div class="card-body p-0">
                <div class="table-responsive">
                    <table class="table table-hover table-striped align-middle mb-0">
                        <thead class="table-primary text-white">
                            <tr>
                                <th class="py-3 ps-3">ID</th>
                                <th class="py-3">Tên danh mục</th>
                                <th class="py-3 text-center">Hành động</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="category : ${categories}">
                                <td class="ps-3 fw-bold" th:text="${category.id}"></td>
                                <td class="fw-semibold" th:text="${category.name}"></td>
                                <td class="text-center">
                                    <a th:href="@{/categories/edit/{id}(id=${category.id})}" class="btn btn-warning btn-sm me-1" title="Sửa">
                                        <i class="fa-solid fa-pen-to-square"></i>
                                    </a>
                                    <a th:href="@{/categories/delete/{id}(id=${category.id})}" 
                                       class="btn btn-danger btn-sm"
                                       onclick="return confirm('Bạn có chắc muốn xóa danh mục này không?')" title="Xóa">
                                        <i class="fa-solid fa-trash"></i>
                                    </a>
                                </td>
                            </tr>
                            <tr th:if="${#lists.isEmpty(categories)}">
                                <td colspan="3" class="text-center py-4 text-muted">
                                    <i class="fa-regular fa-folder-open fa-2x mb-2"></i><br>Chưa có danh mục nào.
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
