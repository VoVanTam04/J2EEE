<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
    layout:decorate="~{_layout}">

<head>
    <title>Đăng ký tài khoản</title>
</head>

<body>
    <div layout:fragment="content" class="d-flex justify-content-center align-items-center" style="min-height: 70vh;">
        <div class="card shadow border-0" style="width: 100%; max-width: 450px; border-radius: 12px;">
            <div class="card-header bg-primary text-white text-center py-3" style="border-radius: 12px 12px 0 0;">
                <h3 class="mb-0"><i class="fa-solid fa-user-plus me-2"></i>Đăng ký tài khoản</h3>
            </div>
            <div class="card-body p-4">
                <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>
                
                <form th:action="@{/register}" method="post" th:object="${account}">
                    <div class="mb-3">
                        <label for="username" class="form-label fw-bold">Tên đăng nhập <span class="text-danger">*</span></label>
                        <div class="input-group">
                            <span class="input-group-text"><i class="fa-solid fa-user text-muted"></i></span>
                            <input type="text" class="form-control" id="username" name="username" th:field="*{username}" required placeholder="Nhập tên đăng nhập...">
                        </div>
                    </div>
                    <div class="mb-4">
                        <label for="password" class="form-label fw-bold">Mật khẩu <span class="text-danger">*</span></label>
                        <div class="input-group">
                            <span class="input-group-text"><i class="fa-solid fa-lock text-muted"></i></span>
                            <input type="password" class="form-control" id="password" name="password" th:field="*{password}" required placeholder="Mật khẩu bảo mật...">
                        </div>
                    </div>
                    <button type="submit" class="btn btn-warning w-100 py-2 fw-bold text-dark shadow-sm">
                        Đăng Ký Khách Hàng Nhanh
                    </button>
                </form>
            </div>
            <div class="card-footer bg-light text-center py-3" style="border-radius: 0 0 12px 12px;">
                Đã có tài khoản? <a href="/login" class="text-primary fw-bold text-decoration-none">Đăng nhập ngay</a>
            </div>
        </div>
    </div>
</body>
</html>
